name: Test, Build & Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_NEW_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test  

  version:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      version: ${{ steps.setver.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_NEW_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Semantic Release
        id: semantic
        run: |
          npx semantic-release || echo "no new release"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_NEW_PAT }}

      - name: Get Released Version
        id: setver
        run: |
          
          VERSION=$(git describe --tags --abbrev=0)
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION"

  build_and_push:
    needs: [test, version]
    runs-on: ubuntu-latest
    if: needs.version.outputs.version != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_NEW_PAT }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }} \
                       -t ${{ secrets.DOCKER_USERNAME }}/demo:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:latest

      - name: Done
        run: echo "Pushed version ${{ env.VERSION }} and latest"

name: Test, Build & Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.8.1'
      
      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test  

  build:
    runs-on: ubuntu-latest
    needs: test  

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set version for the image
        run: VERSION=1.0.${{ github.run_number }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image with version & latest tags
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }} \
            -t ${{ secrets.DOCKER_USERNAME }}/demo:latest .


  push:
    runs-on: ubuntu-latest
    needs: build 
    
    env:
      VERSION: ${{ needs.build.outputs.VERSION }}
   
    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker Images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:latest

      - name: Print status
        run: echo "Successfully pushed version ${{ env.VERSION }} and latest"

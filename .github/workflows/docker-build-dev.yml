name: Build and Publish Dev Docker Image

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image for Dev
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/demo:dev-latest .

      - name: Push Docker Image for Dev
        run: docker push ${{ secrets.DOCKER_USERNAME }}/demo:dev-latest

      - name: Print status
        run: echo "Successfully pushed dev-latest image"

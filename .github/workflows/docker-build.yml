name: Build and Publish image to Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Run Semantic Release
        id: semantic
        run: npx semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Get Released Version
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build & Push Production Docker Image
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.version != 'none'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Production Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }} .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/demo:latest .

      - name: Push Production Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:latest

      - name: Update Deployment Status
        run: |
          echo "Production deployment completed for version ${{ env.VERSION }}"

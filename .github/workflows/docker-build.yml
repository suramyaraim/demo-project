name: Build and Publish image to Docker Hub

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [main]

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set version
        id: set-version
        run: |
          # Example: Read version from VERSION.txt
          VERSION=$(cat VERSION.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: version
    if: needs.version.outputs.version != 'none'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image with version & latest tags
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }} \
            -t ${{ secrets.DOCKER_USERNAME }}/demo:latest .

      - name: Push Docker Images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:latest

      - name: Print status
        run: echo "Successfully pushed version ${{ env.VERSION }} and latest"

name: Build and Publish image to Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      version: ${{ steps.setver.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_NEW_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Semantic Release
        id: semantic
        run: |
          npx semantic-release || echo "no new release"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_NEW_PAT }}

      - name: Get Released Version
        id: setver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION"

  build-and-push:
    name: Build & Push Production Docker Image
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.version != ''

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_NEW_PAT }}

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Production Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }} ${{ secrets.DOCKER_USERNAME }}/demo:latest

      - name: Push Production Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/demo:latest

      - name: Update Deployment Status
        run: |
          echo "Production deployment completed for version ${{ env.VERSION }}"

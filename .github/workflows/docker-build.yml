name: Build and Publish image to Docker Hub

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set version for the image
        if: github.ref == 'refs/heads/main'
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image based on Branch
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"

          if [ "$BRANCH_NAME" = "dev" ]; then
            docker build -t ${{ secrets.DOCKER_USERNAME }}/demo:dev-latest .
          elif [ "$BRANCH_NAME" = "qa" ]; then
            docker build -t ${{ secrets.DOCKER_USERNAME }}/demo:qa-latest .
          elif [ "$BRANCH_NAME" = "main" ]; then
            docker build \
              -t ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }} \
              -t ${{ secrets.DOCKER_USERNAME }}/demo:latest .
          fi

      - name: Push Docker Images to Docker Hub
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"

          if [ "$BRANCH_NAME" = "dev" ]; then
            docker push ${{ secrets.DOCKER_USERNAME }}/demo:dev-latest
          elif [ "$BRANCH_NAME" = "qa" ]; then
            docker push ${{ secrets.DOCKER_USERNAME }}/demo:qa-latest
          elif [ "$BRANCH_NAME" = "main" ]; then
            docker push ${{ secrets.DOCKER_USERNAME }}/demo:${{ env.VERSION }}
            docker push ${{ secrets.DOCKER_USERNAME }}/demo:latest
          fi

      - name: Print status
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"

          if [ "$BRANCH_NAME" = "dev" ]; then
            echo "Successfully pushed dev-latest image"
          elif [ "$BRANCH_NAME" = "qa" ]; then
            echo "Successfully pushed qa-latest image"
          elif [ "$BRANCH_NAME" = "main" ]; then
            echo "Successfully pushed version ${{ env.VERSION }} and latest"
          fi

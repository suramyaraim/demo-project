name: Build and Publish image to Docker Hub

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [main]

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set version
        id: set-version
        run: |
          # Set your desired version here
          VERSION="v1.0.1"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build & Push Production Docker Image
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.version != 'none'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.8.1'

      - name: Install Dependencies
        run: npm install

      - name: Set up Docker credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build Production Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/image:${{ env.VERSION }} .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/image:latest .

      - name: Push Production Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/image:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/image:latest

      - name: Update Deployment Status
        run: |
          echo "Production deployment completed for version ${{ env.VERSION }}"
